<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe5a7"/><stop offset=".58" stop-color="#ffb52e"/><stop offset="1" stop-color="#e66a10"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="vw" maskUnits="userSpaceOnUse" mask-type="alpha" x="0" y="0" width="64" height="64">
      <image href="vw-logo-source.png" x="11" y="11" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#100b06" stroke="#ffb52e" stroke-opacity=".45" stroke-width="1.4"/>
  <rect x="11" y="11" width="42" height="42" fill="url(#amber)" mask="url(#vw)" filter="url(#glow)"/>
  <rect x="1.8" y="1.8" width="60.4" height="60.4" rx="15.2" fill="none" stroke="#ffe2a0" stroke-opacity=".3"/>
</svg>