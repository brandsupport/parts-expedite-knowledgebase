name: Deploy Parts Expedite preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate frontend source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s assets/favicon.svg
          test -s assets/parts-doodle-background.svg
          node --check js/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("site.webmanifest").read_text())
          assert manifest["name"] == "Parts Expedite Knowledge Base"
          for icon in manifest["icons"]:
              path = Path(icon["src"].lstrip("./"))
              assert path.is_file(), f"Missing manifest icon: {path}"
          for avatar in Path("avatars").glob("*.svg"):
              assert avatar.stat().st_size > 100
          print("Frontend files, avatars and browser icons validated.")
          PY

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html site.webmanifest dist/
          cp -R css js assets avatars dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
