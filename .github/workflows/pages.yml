name: Deploy Parts Expedite preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source bundle
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat \
            site-source.tar.gz.b64.part-01 \
            site-source.tar.gz.b64.part-02 \
            site-source.tar.gz.b64.part-03 \
            site-source.tar.gz.b64.part-03b \
            site-source.tar.gz.b64.part-04a \
            site-source.tar.gz.b64.part-04b \
            site-source.tar.gz.b64.part-04c1 \
            site-source.tar.gz.b64.part-04c2 \
            site-source.tar.gz.b64.part-04c3 \
            > /tmp/site-source.tar.gz.b64
          base64 --decode /tmp/site-source.tar.gz.b64 > /tmp/site-source.tar.gz
          tar -tzf /tmp/site-source.tar.gz > /tmp/site-files.txt
          tar -xzf /tmp/site-source.tar.gz -C dist
          test -s dist/index.html
          test -s dist/css/app.css
          test -s dist/js/app.js
          test -s dist/assets/favicon.svg
          test -s dist/assets/parts-doodle-background.svg
          node --check dist/js/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("dist")
          manifest = json.loads((root / "site.webmanifest").read_text())
          assert manifest["name"] == "Parts Expedite Knowledge Base"
          for icon in manifest.get("icons", []):
              assert (root / icon["src"].lstrip("./")).is_file(), icon["src"]
          print(f"Validated {len(list(root.rglob('*')))} deployed paths")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
