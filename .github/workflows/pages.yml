name: Deploy Parts Expedite preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract source screenshots when archive is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/parts-expedite-article-images.zip ]; then
            mkdir -p data/article_images
            unzip -oq data/parts-expedite-article-images.zip -d data/article_images
            echo "Extracted source article screenshots."
          else
            echo "Screenshot archive not uploaded yet; building the site without image galleries."
          fi

      - name: Validate frontend source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s data/articles-01.js
          test -s data/articles-02.js
          test -s data/articles-03.js
          test -s data/article-images.js
          test -s assets/favicon.svg
          test -s assets/parts-doodle-background.svg
          node --check js/app.js
          node --check backend/worker.js
          node --check data/articles-01.js
          node --check data/articles-02.js
          node --check data/articles-03.js
          node --check data/article-images.js
          node --check scripts/build-static.mjs
          node - <<'JS'
          global.window = {};
          require('./data/articles-01.js');
          require('./data/articles-02.js');
          require('./data/articles-03.js');
          const articles = window.PE_IMPORTED_ARTICLES || [];
          if (articles.length !== 30) throw new Error('Expected 30 imported articles, found ' + articles.length);
          if (new Set(articles.map(a => a.id)).size !== 30) throw new Error('Imported article IDs are not unique');
          for (const article of articles) {
            if (!article.title || !article.category || !article.tags?.length || !article.body) throw new Error('Incomplete article: ' + article.id);
          }
          console.log('Validated 30 unique imported articles.');
          JS
          node - <<'JS'
          global.window = {};
          require('./data/article-images.js');
          const images = Object.values(window.PE_ARTICLE_IMAGE_MANIFEST || {}).flat();
          const ids = new Set(images.map(x => x.id));
          const files = new Set(images.map(x => x.key));
          if (images.length !== 60) throw new Error('Expected 60 article screenshot references, found ' + images.length);
          if (ids.size !== 60) throw new Error('Screenshot reference IDs are not unique');
          if (files.size !== 58) throw new Error('Expected 58 unique source screenshots, found ' + files.size);
          if (images.some(x => !x.key?.startsWith('article_images/') || !x.key.endsWith('.avif'))) throw new Error('Invalid repository screenshot path');
          const missing = [...files].filter(p => !require('node:fs').existsSync('data/' + p));
          if (require('node:fs').existsSync('data/parts-expedite-article-images.zip') && missing.length) {
            throw new Error('Screenshot archive did not supply all images: ' + missing.join(', '));
          }
          if (missing.length) console.warn('Screenshot source archive is not present yet; ' + missing.length + ' image files will be skipped for this build.');
          else console.log('Validated all 60 references and 58 unique source screenshots.');
          JS
          python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          manifest = json.loads(Path("site.webmanifest").read_text())
          assert manifest["name"] == "Parts Expedite Knowledge Base"
          for icon in manifest["icons"]:
              path = Path(icon["src"].lstrip("./"))
              assert path.is_file(), f"Missing manifest icon: {path}"
          for avatar in Path("avatars").glob("*.svg"):
              assert avatar.stat().st_size > 100
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys=ON")
          for migration in sorted(Path("backend/migrations").glob("*.sql")):
              db.executescript(migration.read_text(encoding="utf-8"))
          assert db.execute("SELECT COUNT(*) FROM categories").fetchone()[0] == 8
          assert db.execute("SELECT COUNT(*) FROM articles").fetchone()[0] == 30
          assert db.execute("SELECT COUNT(*) FROM article_images").fetchone()[0] == 60
          assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          print("Validated site metadata and imported library schema.")
          PY

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-static.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
