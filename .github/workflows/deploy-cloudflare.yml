name: Deploy Parts Expedite live Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending D1 schema/data migrations before deployment"
        required: true
        default: true
        type: boolean
      enable_authentication:
        description: "Enable account sign-in after the first administrator has been bootstrapped"
        required: true
        default: false
        type: boolean

concurrency:
  group: parts-expedite-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, migrate and deploy the live workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project tools
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare configuration and credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.jsonc; then
            echo "Replace the D1 database_id in wrangler.jsonc before deploying."
            exit 1
          fi
          test -s data/parts-expedite-article-images.zip

      - name: Extract the original AVIF screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/article_images
          unzip -oq data/parts-expedite-article-images.zip -d data/article_images
          count="$(find data/article_images -maxdepth 1 -type f -name '*.avif' | wc -l | tr -d ' ')"
          test "$count" = "58" || { echo "Expected 58 unique AVIF screenshots, found $count"; exit 1; }

      - name: Validate source and build the Worker asset bundle
        run: |
          npm run check
          npm run build

      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply parts-expedite-db --remote

      - name: Upload source screenshots to private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: parts-expedite-media
        run: npm run r2:upload-source-images

      - name: Deploy Worker and same-origin website
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var AUTH_ENABLED:${{ inputs.enable_authentication && 'true' || 'false' }}
