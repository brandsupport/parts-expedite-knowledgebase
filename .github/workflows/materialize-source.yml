name: Materialize frontend source files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-frontend
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s site-source.tar.gz
          tar -tzf site-source.tar.gz
          tar -xzf site-source.tar.gz -C .
          test -s index.html
          test -s css/app.css
          test -s js/app.js
          test -s assets/favicon.svg
          test -s assets/parts-doodle-background.svg
          node --check js/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("site.webmanifest").read_text())
          assert manifest["name"] == "Parts Expedite Knowledge Base"
          for icon in manifest["icons"]:
              target = Path(icon["src"].lstrip("./"))
              assert target.is_file(), f"Missing manifest icon: {target}"
          print("Source archive and manifest validated.")
          PY

      - name: Commit visible source files
        shell: bash
        run: |
          set -euo pipefail
          rm -f site-source.tar.gz site-source.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.webmanifest css js assets avatars
          if git diff --cached --quiet; then
            echo "Frontend files are already committed."
            exit 0
          fi
          git commit -m "Expose Parts Expedite frontend source files"
          git pull --rebase --autostash origin main
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Could not push the materialized source after three attempts."
          exit 1
